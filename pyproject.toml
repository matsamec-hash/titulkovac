[project]
name = "titulkovac"
version = "0.1.0"
description = "Automaticke titulkovani podcastu (prepis lokalne + AI delení a preklad)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
transcribe = ["whisperx>=3.1"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
titulkovac = "titulkovac.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titulkovac"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
